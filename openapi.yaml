openapi: 3.1.2
info:
  title: CreditTracker API
  description: API Spec for Credit Tracker
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /credits:
    get:
      operationId: listCredits
      summary: List distinct coasters ridden, one entry per coaster
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credits"

  /rides:
    get:
      operationId: listRides
      summary: List logged rides, most recent first
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum rides to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: >
            Opaque cursor from a previous response's nextCursor. Returns rides
            older than the one it points at.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rides"

  /log/{coasterID}:
    post:
      operationId: logRide
      summary: log a single views on a coaster. must populate either name of coaster or coaster id.
      parameters:
        - name: coasterID
          in: path
          required: true
          description: coaster to log a ride on.
          schema:
            $ref: "#/components/schemas/CoasterRef"
        - name: timestamp
          in: query
          required: true
          description: the time at which the ride happened.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"

  /coasters:
    get:
      operationId: searchCoaster
      summary: List coaster & park, based on search
      parameters:
        - name: q
          in: query
          required: true
          description: the query which users are searching for, returns a coaster reference
          example: kingda ka
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoasterRefs"

components:
  schemas:

    # Primitives

    CoasterID:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/UUID"
    CoasterName:
      type: string
    CoasterManufacturedAt:
      type: string
      format: date-time

    ParkID:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/UUID"
    WithName:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    UUID:
      type: string
      format: uuid
      x-go-type: uuid.UUID
      x-go-type-import:
        path: github.com/google/uuid
    ErrorNotFound:
      type: string

    # First Class Objects

    Coaster:
      description: Rich information about a coaster
      allOf:
        - $ref: "#/components/schemas/CoasterRef"
        - $ref: "#/components/schemas/CoasterName"
        - $ref: "#/components/schemas/CoasterManufacturedAt"
    CoasterRef:
      description: Reference to a coaster.
      allOf:
        - $ref: "#/components/schemas/CoasterID"
    CoasterRefs:
      type: array
      items:
        $ref: "#/components/schemas/CoasterRef"

    ParkRef:
      description: Reference to a park.
      allOf:
        - $ref: "#/components/schemas/ParkID"
    ParkRefs:
      type: array
      items:
        $ref: "#/components/schemas/ParkRef"


    Ride:
      description: A single logged trip on a coaster.
      type: object
      required:
        - coaster
        - riddenAt
      properties:
        coaster:
          $ref: "#/components/schemas/CoasterRef"
        riddenAt:
          type: string
          format: date-time
    Rides:
      type: array
      items:
        $ref: "#/components/schemas/Ride"


    Credit:
      description: >
        Information about aggregated ride events for a coaster
      allOf:
        - $ref: "#/components/schemas/CoasterRef"
        - type: object
          required:
            - rideCount
            - firstRiddenAt
            - lastRiddenAt
          properties:
            rideCount:
              type: integer
              minimum: 1
              description: Number of logged rides on this coaster
            firstRiddenAt:
              type: string
              format: date-time
            lastRiddenAt:
              type: string
              format: date-time
    Credits:
      type: array
      items:
        $ref: "#/components/schemas/Credit"