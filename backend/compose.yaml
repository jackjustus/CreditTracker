services:
  db:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: testtest
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://postgres:testtest@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:18
    environment:
      PGPASSWORD: testtest
    volumes:
      - ./db/seed:/seed:ro
    command: >
      psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /seed/seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api-service:
    build: .
    # `docker compose watch` rebuilds and recreates this service when Go source
    # or deps change. Migrations are deliberately not watched: applying them is
    # the `migrate` one-shot's job, not a side effect of rebuilding the binary.
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
    environment:
      DATABASE_URL: postgres://postgres:testtest@db:5432/postgres?sslmode=disable
      # Ollama runs natively on the host, not in a container: Docker Desktop on
      # macOS has no GPU passthrough, so a containerized Ollama would be
      # CPU-only. The host daemon must bind 0.0.0.0 (OLLAMA_HOST) to accept
      # this; on loopback it only answers processes on the Mac itself.
      OLLAMA_URL: http://host.docker.internal:11434
    # Automatic on Docker Desktop; this makes it work on Linux hosts too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
     - "8080:8080"


volumes:
  pgdata:
