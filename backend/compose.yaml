services:
  db:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: testtest
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://postgres:testtest@db:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: postgres:18
    environment:
      PGPASSWORD: testtest
    volumes:
      - ./db/seed:/seed:ro
    command: >
      psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /seed/seed.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      # nomic-embed-text is ~274MB. A volume keeps it across container
      # replacement instead of re-downloading on every recreate.
      - ollama:/root/.ollama
    healthcheck:
      # The image ships no curl. The CLI talks to the local daemon and exits
      # non-zero until it is answering.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot: pulls the embedding model, then exits. api-service gates on it so
  # the first search request cannot race the download.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api-service:
    build: .
    # `docker compose watch` rebuilds and recreates this service when Go source
    # or deps change. Migrations are deliberately not watched: applying them is
    # the `migrate` one-shot's job, not a side effect of rebuilding the binary.
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
    environment:
      DATABASE_URL: postgres://postgres:testtest@db:5432/postgres?sslmode=disable
      # Ollama is containerised everywhere, dev included, so there is one code
      # path instead of two. Inference is CPU-only on macOS (Docker Desktop has
      # no GPU passthrough), which costs nothing that matters here: the request
      # path embeds a single short query, not a corpus.
      OLLAMA_URL: http://ollama:11434
    # db carries this too; without it the API does not come back after a reboot.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    ports:
     - "8080:8080"


volumes:
  pgdata:
  ollama:
